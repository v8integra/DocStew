<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>DocStew</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="app-name">DocStew</span>
      <button id="open-folder-btn">Open Folder</button>
      <button id="palette-btn" title="Command Palette (Ctrl+K)">⌘ Command Palette</button>
    </header>

    <div id="layout">
      <aside id="sidebar">
        <h2>Library</h2>
        <ul id="file-list"></ul>
      </aside>

      <main id="main-pane">
        <p id="empty-state">Open a folder to get started, or select a file from the library.</p>
        <pre id="content-view" hidden></pre>
      </main>
    </div>

    <div id="command-palette" hidden>
      <input id="palette-input" type="text" placeholder="Type a command..." />
      <ul id="palette-results"></ul>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
